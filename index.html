<script>window.STORY={"format":"kadr-story","version":1,"project":{"id":"7dc8cca6-feba-4786-bb94-d3e739522d1a","title":"Слепая зона","synopsis":"История о собаках и холостяках","coverId":"aaddcc29-d0c7-48f1-b1df-bca9a16260f9","createdAt":1794768338229,"updatedAt":1794776682280},"episodes":[{"id":"1e703e0c-eb0e-4c36-b839-f2c59afd2dff","projectId":"7dc8cca6-feba-4786-bb94-d3e739522d1a","title":"Глава 21. Ложь во благо","synopsis":"","order":1,"coverId":null,"scenes":[{"id":"daa8e579-de4a-442a-8f1b-cbaf141d84a6","backgroundId":"d21b184e-0a8c-4c78-8346-ea7abe5a50b2","cast":[],"plate":"chapter","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"Глава 21","text":"Ложь во благо","plateBox":{"x":34.58896832193175,"y":41.37890629582783,"w":32.147250505710225,"h":26.685301976003473},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":"fb3bc4e9-1f0b-49b1-aea8-fa12a8b33bfc","videoId":null},{"id":"9874b5d7-1f61-49bb-aafc-98ea74ef3ad8","backgroundId":"d21b184e-0a8c-4c78-8346-ea7abe5a50b2","cast":[],"plate":"epigraph","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"К.Х.","kicker":"","text":"Ты держишь плащ над хрупкостью плеча,\nНе зная, что внутри бушует пламя.\nЯ ухожу, ни разу не крича,\nОставив свет\nнетронутым меж нами.","plateBox":{"x":33.92035812383444,"y":22.787380154091146,"w":33.04275308568332,"h":53.754181003612956},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"2cc306ac-731c-4b11-8c01-8695161f1558","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Простыня сползла с голого плеча Кейна, запутавшись у него в лодыжках. Хлоя лежала на самом краю матраса, подложив ладонь под горячую щеку, и смотрела, как серая полоса света из-под жалюзи медленно ползет по его скуле.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"fade","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"14d95073-915f-4271-9292-8fd3cf5158d1","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Во сне он казался моложе. Складка между бровями разгладилась, нижняя губа чуть приоткрылась на выдохе, а темные ресницы отбрасывали на бледную кожу короткие тени.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"f1214d07-a652-4a72-98ac-445f408f0385","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Пальцы его правой руки, раскинутой поперек подушки, изредка подрагивали, словно он даже сейчас сжимал штурвал. Над самым запястьем тускло блестел матовый титан. Хлоя перевела взгляд на собственную руку.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"b02bb748-3f10-470d-8353-47699a5ee96a","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Тяжелый обруч врезался в косточку, стоило чуть пошевелить кистью. Под ребрами ворочался тугой ком — гулкая пустота, в которой утонули и вчерашняя ярость, и хриплый шепот у ее ключицы. Она моргнула, чувствуя, как щиплет сухие веки.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"9f1fcbfe-6d7c-4a93-bdbd-f39aeb7f6aa0","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"За стеной вдруг грохнуло, разрезая тишину апартаментов звоном стекла.\nХлоя дернулась, приподнимаясь на локтях, и тут же зажмурилась.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"beb83fd2-c84c-42e5-a1ac-8faba55f5af5","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Потолок качнулся, в виски вогнали два раскаленных гвоздя, а к горлу подкатила горячая волна. Рядом глухо выдохнул Кейн, прикрывая глаза предплечьем и морщась от полосатого света.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"1a6dd454-0d96-406d-9ba7-d462ab8dcf46","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Стиснув зубы, Хлоя спустила ноги на холодный паркет. По спине пробежала мелкая дрожь.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"42f4794f-fe74-4f55-9289-e6360b4b24d2","backgroundId":"46e9f279-c547-4baa-be07-2c21939a9cb4","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Она подхватила с пола растянутую майку, кое-как натянула джинсы, путаясь пальцами в пуговице, и толкнула дверь в коридор, придерживаясь плечом за косяк. ","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"e403539c-8fb0-4ee0-8cf7-f17a0da52d36","backgroundId":"68cfdaf3-a7a9-40f4-82cd-29efebdce874","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"На кухне у самой раковины, вцепившись обеими руками в край столешницы, стояла Пейдж.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"fade","bgmMode":"stop","bgmId":null,"sfxId":"d1623d9a-77e1-463b-b030-7fb9a98d2cca","videoId":null},{"id":"87f1992c-c861-4196-a6b6-a17e42ca2349","backgroundId":"68cfdaf3-a7a9-40f4-82cd-29efebdce874","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Светлые пряди спутались на затылке, под глазами залегли сизые круги, а у самых босых ног поблескивали осколки разбитого стакана. Пейдж медленно повернула голову, прижимая к губам бутылку с водой.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"eaab5c03-a512-4122-ba9f-9e3c91bda22c","backgroundId":"68cfdaf3-a7a9-40f4-82cd-29efebdce874","cast":[{"id":"15107a63-daec-4674-be4f-54d8eef81696","assetId":"f4e7d12d-4555-43fb-8679-75fa1f31b470","slot":"center","flip":false,"x":75.08260237369393,"y":3.446627151104643,"h":119.59614326046442}],"plate":"dialogue","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"Пейдж","kicker":"","text":"Осторожно.","plateBox":{"x":51. 226986}],"plate":"dialogue","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"Декс","kicker":"","text":"И правда выросла, значит.","plateBox":{"x":52.246332612440895,"y":57.55419978070856,"w":24.975032684530138,"h":17.574897003263203},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"a0816791-b42a-4107-ac69-48c6ac09f91a","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Тихо пробормотал он, проводя ладонью по седой щетине.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"56b34aa9-515d-4d21-81a4-9c6426be4cb5","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[{"id":"f604158b-cc0c-4ab0-9458-b60f30ca8057","assetId":"661e1399-2e6c-4f0a-9e62-f0bc6ef06569","slot":"center","flip":true,"x":76.96506274887838,"y":-1.2054429310302588,"h":122.57278028226986}],"plate":"dialogue","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"Декс","kicker":"","text":"Ну что ж… раз решила — езжай.","plateBox":{"x":52.246332612440895,"y":57.55419978070856,"w":24.975032684530138,"h":17.574897003263203},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"a338a725-d2d5-47a1-8689-a2601a39751c","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Они поднялись почти одновременно. Вэл шагнула первой, крепко прижала Хлою к себе, шепнув на ухо слова напутствия и пожелания удачи.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"25f907e6-2c41-4963-ae06-01650cdc16be","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Декс обнял ее следом — коротко, по-мужски, хлопнув широкой ладонью по спине, и тут же отвернулся к столу, поправляя чайник.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"f6af5215-cfb3-42cc-9ebe-85081adc0c05","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[{"id":"62fdd57b-e948-4956-983f-8b59d87d58d7","assetId":"7e0be969-3c67-4096-8ebb-4e34e3ed4f36","slot":"center","flip":false,"x":2.8535954546730986,"y":4.999315692790935,"h":106.87864484736302}],"plate":"dialogue","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"Хлоя","kicker":"","text":"Надеюсь, мы еще встретимся.","plateBox":{"x":20.543697343601085,"y":57.32673737518783,"w":24.35441652868267,"h":19.559234039081588},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"43c2ae3c-f038-4951-b7b8-a9875dcc5ed3","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Голос Хлои дрогнул лишь на долю секунды, но она тут же натянула улыбку.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"84926e00-eaa5-4122-a969-2eaee29d8f7e","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[{"id":"ea9f5897-0b5d-4cd4-82a0-ea05acbff9ce","assetId":"8c9f9cd2-cfb3-4e67-af55-450e91de99e2","slot":"center","flip":false,"x":2.8535954546730986,"y":4.999315692790935,"h":106.87864484736302}],"plate":"dialogue","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"Хлоя","kicker":"","text":"Не развалите тут все без меня.","plateBox":{"x":20.543697343601085,"y":57.32673737518783,"w":24.35441652868267,"h":19.559234039081588},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"64811c8c-44b5-40fd-a087-ba1821ebb4bc","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[{"id":"0dc55295-b85b-4555-8c35-8de9a7c05efe","assetId":"661e1399-2e6c-4f0a-9e62-f0bc6ef06569","slot":"center","flip":true,"x":76.96506274887838,"y":-1.2054429310302588,"h":122.57278028226986}],"plate":"dialogue","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"Декс","kicker":"","text":"Да иди уже, справимся.","plateBox":{"x":52.246332612440895,"y":57.55419978070856,"w":24.975032684530138,"h":17.574897003263203},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"90c6dd2c-4df2-4318-8a29-b43edbcd3b19","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Буркнул Декс, не оборачиваясь.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"91867e0c-61a3-4bb3-bdb7-399b0618f7f1","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Пластиковая дверь за ними захлопнулась, отсекая тепло подсобки. Они быстро прошли через ремзону, мимо ревущих моторов и летящих искр, и вышли за тяжелую створку бокса на холодный серый ветер Северной объездной.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"c32cfc1c-c12b-4d3e-8217-a03f1b6889ed","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Внутри подсобки, едва стихли шаги за стеклом, Декс медленно опустился обратно на ящик.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":"27b91ec2-7558-42e1-ba5c-226d4db2e7b6","videoId":null},{"id":"8bc1d01a-bdbd-420a-bf3b-a856f8c7e581","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Его широкие, привыкшие к тяжелому металлу плечи мелко задрожали, а по обветренным щекам, теряясь в седой щетине, покатились скупые, горячие слезы. Старик закрыл лицо ладонями, глухо всхлипнув.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"64fb7bda-a74d-4aaa-aba9-e9b908409cde","backgroundId":"22a8dfb3-4885-4ea8-96bc-a3296d929031","cast":[],"plate":"narration","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Вэл молча подошла сзади, обвила его шею руками и прижалась щекой к его затылку, крепко сжимая, разделяя с ним эту внезапную, обрушившуюся пустоту.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"cut","bgmMode":"keep","bgmId":null,"sfxId":null,"videoId":null},{"id":"8928779 ":null},{"id":"4111f9cd-f61f-4770-8859-862a575492f2","backgroundId":"41205b2c-d1f5-4307-b345-ad7e4f72abed","cast":[],"plate":"cutscene","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Пиздец.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"tumble","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"0c9b5516-951f-42a1-b37e-de9625282414","backgroundId":"e19b94b9-7c66-4df6-be7f-b4e34ec7692f","cast":[],"plate":"cutscene","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Пиздец.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"slide-left","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"aa279f9e-48ae-4200-a0fe-6a9814f3c40d","backgroundId":"fe8896d5-550a-40c2-8d71-7c56bbd8b94c","cast":[],"plate":"cutscene","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Пиздец.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"slide-right","bgmMode":"stop","bgmId":null,"sfxId":null,"videoId":null},{"id":"791f00a3-728d-41ca-a5f8-1c51d5aab365","backgroundId":"c3394522-c321-458b-9dba-4bbff39963ad","cast":[],"plate":"cutscene","plateAssetId":"5c47aa43-3c39-4521-b7b4-7e1adb79457f","speaker":"","kicker":"","text":"Пиздец.","plateBox":{"x":33.99634204137609,"y":24.52842407324752,"w":33.17852715650306,"h":53.231132849419566},"anchorSlot":null,"textOnDark":false,"transition":"flash","bgmMode":"stop","bgmId":null,"sfxId":"9667b46e-08df-40ce-a205-e695105e206f","videoId":null}],"createdAt":1794768338229,"updatedAt":1794776682280,"script":"Глава: Глава 21\nГлава_название: Ложь во благо\n\nЭпиграф: ооо\nИсточник: К.Х.\n\nАвтор:\nПростыня сползла с голого плеча Кейна, запутавшись у него в лодыжках. Хлоя лежала на самом краю матраса, подложив ладонь под горячую щеку, и смотрела, как серая полоса света из-под жалюзи медленно ползет по его скуле. Во сне он казался моложе. Складка между бровями разгладилась, нижняя губа чуть приоткрылась на выдохе, а темные ресницы отбрасывали на бледную кожу короткие тени. Пальцы его правой руки, раскинутой поперек подушки, изредка подрагивали, словно он даже сейчас сжимал штурвал. Над самым запястьем тускло блестел матовый титан. Хлоя перевела взгляд на собственную руку. Тяжелый обруч врезался в косточку, стоило чуть пошевелить кистью. Под ребрами ворочался тугой ком — гулкая пустота, в которой утонули и вчерашняя ярость, и хриплый шепот у ее ключицы. Она моргнула, чувствуя, как щиплет сухие веки.\n\nЗа стеной вдруг грохнуло, разрезая тишину апартаментов звоном стекла.\n\nХлоя дернулась, приподнимаясь на локтях, и тут же зажмурилась. Потолок качнулся, в виски вогнали два раскаленных гвоздя, а к горлу подкатила горячая волна. Рядом глухо выдохнул Кейн, прикрывая глаза предплечьем и морщась от полосатого света. Стиснув зубы, Хлоя спустила ноги на холодный паркет. По спине пробежала мелкая дрожь. Она подхватила с пола растянутую майку, кое-как натянула джинсы, путаясь пальцами в пуговице, и толкнула дверь в коридор, придерживаясь плечом за косяк. На кухне у самой раковины, вцепившись обеими руками в край столешницы, стояла Пейдж. Светлые пряди спутались на затылке, под глазами залегли сизые круги, а у самых босых ног поблескивали осколки разбитого стакана. Пейдж медленно повернула голову, прижимая к губам бутылку с водой.\n\nПейдж: Осторожно.\n\nПейдж: Стекло.\n\nАвтор: Хлоя обошла рассыпанные осколки, привалилась поясницей к холодильнику и скрестила руки на груди.\nХлоя: Доброе утро.\nАвтор: Пейдж сделала жадный глоток, вытерла рот тыльной стороной ладони и прислонилась затылком к верхнему шкафчику, прикрыв веки.\n\nХлоя: Меня будто по голове били. Толпой.\n\nХлоя: Мы вообще как доехали?\n\nПейдж: Сама не знаю.\n\nПейдж:Помню только какую-то дрянь... на вкус как тормозная жидкость.\n\nХлоя: А, это... вроде текила была.\n\nАвтор: Пейдж криво усмехнулась и тут же поморщилась, хватаясь за виски.\nПейдж: \nВсе равно дрянь.\nПейдж:Сука, смеяться больно.\n\nАвтор: В коридоре скрипнула половица. В проеме появился Кейн, взгляд его оставался мутным и тяжелым.\n\nХлоя тут же отвернулась к окну, уставившись на серый шпиль соседней башни, и суетливо одернула край майки.\n\nПейдж: Утро доброе, пилот.\n\nАвтор: Пейдж распахнула глаза, оглядела его с ног до головы, перевела взгляд на Хлою, и ее губы тронула ленивая ухмылка. Кейн коротко кивнул, тяжело усмехнувшись уголком рта и направился к холодильнику.\nПейдж снова перевела взгляд с его обнаженной спины на напряженную шею Хлои. Пауза затянулась на пару ударов сердца, а затем по лицу Пейдж медленно расползлась лукавая улыбка.\n\nПейдж: А вы чего…\n\nПейдж: Спали вместе, что ли?\n\nХлоя: Хлоя повернула голову и впилась в нее кровожадным взглядом. Пейдж тихо фыркнула, тут же схватилась за лоб и подняла ладони.\n\nПейдж: Молчу-молчу.\n\nПейдж: Совет да любовь.\n\nАвтор: Она отошла от раковины, переступая через осколки, и принялась открывать верхние шкафчики, заглядывая внутрь.\n\nПейдж: Какие планы на сегодня?\n\nПейдж: Последний день свободы как-никак.\n\nКейн: Разберемся. \nАвтор: Кейн достал из нижнего ящика пакет с кормом, подошел к клетке и присел на корточки, высыпав горсть гранул в металлическую миску. Из темноты домика бесшумно вытек крупный белый крыс, ткнулся носом в его костяшки и принялся хрустеть. Кейн задержал ладонь на его загривке, поглаживая густую шерсть, и у Хлои неприятно кольнуло под ключицей. Он поднялся, выудил из холодильника запотевшую бутылку воды, вытряхнул из блистера две таблетки и проглотил их, запрокинув голову. Затем повернулся к Хлое, держа в руке еще пару, и вопросительно приподнял бровь. Хлоя смотрела на его раскрытую ладонь пару секунд. Виски пульсировали. Она выдохнула, шагнула вперед, забрала таблетки, стараясь задевать его пальцы как можно меньше, и проглотила капсулы. Спустя двадцать минут, когда горячая вода утреннего душа смыла с кожи липкий ночной пот, Хлоя вернулась в гостиную. На столе дымились три кружки черного кофе, а Пейдж сосредоточенно скребла ножом подгоревший тост. \n\nКейн: Хлоя, начнем с тебя.\n\nАвтор: Он поставил кружку на стол, глядя прямо перед собой.\n\nКейн: Времени до вечера.\n\nАвтор: Хлоя села напротив, обхватив ладонями горячий фарфор.\n\nХлоя: Не знаю что делать.\nХлоя: Не могу же я просто прийти и сказать: \nХлоя: «Привет, Декс, я в космос, вот тебе бабки, не скучай».\nПейдж: Значит, нужна легенда.\n\nАвтор: Пейдж откусила край тоста, облизала палец и прищурилась.\n\nПейдж: Скажи, что выиграла в лотерею.\n\nПейдж: Или наследство свалилось от тетки какой-нибудь из-за кардона.\n\nХлоя: Бред.\n\nАвтор: Хлоя покачала головой.\n\nХлоя: У меня из родни никого. И Декс в курсе.\n\nПейдж: Тогда скажи, что нашла богатого мужика.\n\nАвтор: Пейдж кивнула в сторону Кейна.\n\nПейдж: Вон сидит. Чем не спонсор?\n\nХлоя: И что? В ссылку с любимым? Дичь.\nАвтор: Хлоя фыркнула, прикусив губу.\nВ кухне повисла тишина. Слышно было только, как в углу мерно вылизывается Чач. Кейн медленно покрутил кружку на столешнице и поднял глаза.\n\nКейн: Скажи, что тебя позвали по контракту.\n\nКейн: Специалистом каким-нибудь, да хоть журналистом статьи писать.\nКейн: Кто-то же новости сочиняет... \nКейн: Вот, будут думать, что ты.\n\nАвтор: Хлоя выгнула бровь.\n\nХлоя: Ты себя слышишь?\n\nХлоя: Я и «писать статьи»?\nХлоя: Кто в эту чушь поверит?\n\nКейн: Поверят.\n\nАвтор: Кейн чуть усмехнулся уголком рта.\n\nКейн: Скажешь, что устроил я.\n\nКейн: По своим связям. \n\nКейн: Высокая ставка, полная страховка, закрытый сектор.\n\nАвтор: Хлоя замерла с кружкой у губ. Декс терпеть не мог верхние эшелоны, но прекрасно знал, что у таких, как Холистер, руки дотягиваются куда угодно. Ради того, чтобы вытащить ее из нищеты, старик мог проглотить и такую сказку.\n\nХлоя: А деньги?\n\nХлоя: Как объясню деньги на его счету?\nКейн: Оформим как подъемные.\n\nКейн: Аванс за секретность.\n\nАвтор: Хлоя медленно опустила кружку на стол и молча кивнула, уставившись в трещину на столешнице. Пейдж перевела взгляд с одного на другого, хмыкнула и допила кофе залпом.\nПейдж: Просто невероятно.\nКейн: Значит, решено.\n\nАвтор: Кейн поднялся из-за стола, подхватил со стула куртку и бросил на стол связку ключей.\n\nКейн: Я съезжу в управление.\n\nКейн: Есть у меня должник там.\nКейн: \nВычищу все досье на Декса.\n\nКейн: А вы?\nАвтор:\nХлоя подняла глаза, встречаясь с его, и тут же отчаянно уставилась в пол.\n\nХлоя: В мастерскую. \n\nАвтор: Тяжелая металлическая створка бокса отошла с до боли знакомым скрежетом, и на них сразу обрушился гул мастерской. Здесь всегда кипела жизнь: в глубине зала ревел на стенде раскрученный до отсечки движок, визжала болгарка, а под высокими перекрытиями метались сизые блики от сварочных аппаратов. Хлоя шагнула через порог первой, втягивая плечи, но тут же расправила спину. Едва ее заметили у верстаков, работа на секунду сбилась. Парни в замасленных комбинезонах заулыбались, замахали руками, кто-то одобрительно хлопнул ладонью по капоту разобранного болида, приветствуя пропавшую. Но стоило из-за плеча Хлои показаться Пейдж, как со стороны подъемников донесся протяжный, восхищенный свист. Пейдж замерла на пороге, нервно сжав пальцами ремешок сумки, но все-таки гордо вскинула подбородок, стараясь не наступить в темную масляную лужу. Из-за дальнего стеллажа с инструментами, вытирая руки, вышел Декс. Увидев Хлою, старик замер на долю секунды, а потом по его обветренному, покрытому глубокими морщинами лицу разлилась такая искренняя, почти детская радость, что он буквально сорвался с места. Старик подлетел к ней, стиснул в медвежьих объятиях, едва не оторвав от пола, но тут же спохватился. Словно устыдившись собственной слабости перед пацанами, Декс резко отстранился, нахмурил густые седые брови и ворчливо буркнул, засовывая тряпку за пояс:\n\nДекс: Ну надо же. Явилась.\n\nАвтор: Хлоя виновато улыбнулась, поправляя рукава, чтобы широкий манжет надежно прикрывал титановый браслет на правом запястье.\n\nХлоя: Прости, Декс. Закрутилась совсем.\n\nХлоя: Познакомься, это Пейдж.\n\nХлоя: Моя подруга.\n\nПейдж: Очень приятно.\nАвтор: Пейдж вежливо кивнула, стараясь улыбаться ровно, хотя сама на мгновение застопорилась, удивленно зыркнув на Хлою. Простое, брошенное вскользь слово отозвалось внутри неожиданным теплом.\n\nДекс: Взаимно, Пейдж.\nАвтор: Декс окинул ее цепким взглядом, в коем мелькнуло легкое недоумение, но тут же махнул рукой в сторону перегородки. \nДекс: Пойдемте, чай как раз вскипел. Вэл с Тоби там обедают.\n\nАвтор: В небольшой подсобке за пластиковой дверью было тесно и шумно от старого вентилятора, бесполезно гоняющего грязный воздух. Вэл едва увидев Хлою, вскочила, но в объятия бросится не посмела. Вэл была человеком крайне закрытым, и несколько недель холода отдалили подруг. Но ее тонкие губы тронула несвойственная ей, довольная улыбка.\nВэл: Живая, значит. А мы уж думали, совсем пропала.\n\nХлоя: Да куда я денусь.\n\nАвтор: Хлоя повернулась к углу, где у холодильника стоял Тоби, жуя бутерброд. Парень заметно вытянулся, плечи раздались, а под обтягивающей майкой перекатывались тугие мышцы. Хлоя одобрительно хлопнула его по предплечью.\n\nХлоя: Ого, Тоби. Не узнать.\nХлоя: Да ты совсем возмужал.\n\nАвтор: Парень только широко улыбнулся, кивнул в ответ и, закинув остаток бутерброда в рот, молча выскользнул обратно в ремзону, притворив за собой дверь. Пейдж осторожно присела на край свободного табурета, стараясь не задеть засаленный край стола. Вэл поставила перед ними две разномастные кружки и прищурилась, переводя настороженный взгляд с Пейдж на Хлою.\n\nВэл: А это кто?\nХлоя: А,это Пейдж. Знакомься. \nВэл: И давно знакомы? \n\nХлоя: Недавно. \nАвтор: Хлоя тут же подхватила кружку обеими руками, пряча запястье под столом. \nХлоя: Помогли друг другу в одном деле.\nВэл: Ну ладно. Добро пожаловать.\nПейдж: Да... Спасибо.\n\nАвтор: Декс разлил густой черный чай, подвинул сахарницу и присел на ящик из-под запчастей, с хрустом вытянув ноги.\n\nДекс: У нас тут вчера опять патрульные кружили. \nДекс: Нос совали в каждый угол, номера переписывали. Но к вечеру вдруг свернулись и свалили.\nХлоя: Странно.\nАвтор: Тихо отозвалась Хлоя, чувствуя, как на затылке проступает холодный пот. \nХлоя: Наверняка опять что-нибудь в центре произошло. \nАвтор: Хлоя и Пейдж коротко зыркнули друг на друга, и нашли подтверждения своих, всплывших внезапно воспоминаний во взглядах. Погром бутика, множественные нарушения скоростного режима и вандализм. Девушки стыдливо уставились в горячий чай. \nВэл: Может и так.\nАвтор: Вэл отпила из кружки, не сводя с Хлои внимательного взгляда. \nВэл: А ты-то сама как? Все так же со своим?\n\nАвтор: Хлоя прикусила нижнюю губу. В груди вдруг стало тесно, словно воздух в маленькой подсобке разом закончился. Она посмотрела на облупившийся пластик стола, на натруженные, навсегда въевшиеся в машинное масло пальцы Декса и на тревожные глаза Вэл. Пейдж под столом едва заметно коснулась ее колена своим — коротко, поддерживающе.\n\nХлоя: Да. Я как раз хотела поговорить об этом.\nХлоя: Вы только не переживайте, ладно?\nХлоя: Но я пришла попрощаться.\n\nАвтор: Вэл замерла с ложкой в руке. Декс нахмурился так, и глубокие складки на лбу сошлись в одну линию.\n\nДекс: В смысле — попрощаться? Куда ты собралась?\n\nХлоя: Кейн устроил меня на работу.\nХлоя: В закрытый исследовательский центр за кордоном. Буду писать статьи всякие. Платить обещают столько, что нам всем до конца жизни хватит.\n\nХлоя: Мы с ним и с Пейдж переезжаем туда уже на днях.\n\nАвтор: Декс смотрел на нее долгую, тяжелую секунду. В его глазах мелькнуло недоверие, потом — глухая обида и резкое нежелание отпускать ту, которую он растил как родную дочь.\n\nДекс: Писать статьи? Ты?\nДекс: Какие к черту статьи? Что за бред ты несешь?\nХлоя: Я же стихи писала, помнишь? И рассказы... \nХлоя Я и сейчас пишу. Он увидел, и...\nДекс: Помню-помню...\nАвтор: От вакуумной тишины пространство спасало лишь жужжание старого холодильника. Хлоя силилась, собирала мысли воедино, пытаясь поверить в свою ложь.\nХлоя: Я понимаю...\nХлоя: Но Кейн в СБ работает, место и правда хорошее. \nХлоя: Да и...\nАвтор: Хлоя едва заметно заерзала на стуле, стараясь не смотреть в глаза старику.\nХлоя: Я люблю Кейна, и хочу поехать с ним. \nХлоя: Это мой последний шанс устроить свою жизнь...\nХлоя: ...так, как я хочу.\n\nХлоя: Я уже перевела на твой счет аванс. \nХлоя: Там хватит, чтобы закрыть все долги и еще Вэл с Тоби останется.\n\nАвтор: Хлоя, наконец, говорила ровно, глядя ему прямо в глаза, хотя внутри все скручивалось в тугой, болезненный узел. Декс сжал челюсти, заходили желваки. Он перевел взгляд на Пейдж — та сидела прямо и уверенно, всем своим видом подтверждая каждое слово. Старик снова зыркнул на Хлою, увидел ее упрямо сжатые губы и внезапно сдулся. Плечи его опустились, а в глазах плеснулась бессильная нежность.\n\nДекс: И правда выросла, значит.\nАвтор: Тихо пробормотал он, проводя ладонью по седой щетине. \nДекс: Ну что ж… раз решила — езжай. \n\nАвтор: Они поднялись почти одновременно. Вэл шагнула первой, крепко прижала Хлою к себе, шепнув на ухо слова напутствия и пожелания удачи. Декс обнял ее следом — коротко, по-мужски, хлопнув широкой ладонью по спине, и тут же отвернулся к столу, поправляя чайник.\n\nХлоя: Надеюсь, мы еще встретимся.\nАвтор: Голос Хлои дрогнул лишь на долю секунды, но она тут же натянула улыбку. \nХлоя: Не развалите тут все без меня.\nДекс: Да иди уже, справимся. \nАвтор: Буркнул Декс, не оборачиваясь.\n\nАвтор: Пластиковая дверь за ними захлопнулась, отсекая тепло подсобки. Они быстро прошли через ремзону, мимо ревущих моторов и летящих искр, и вышли за тяжелую створку бокса на холодный серый ветер Северной объездной.\n\nАвтор: Внутри подсобки, едва стихли шаги за стеклом, Декс медленно опустился обратно на ящик. Его широкие, привыкшие к тяжелому металлу плечи мелко задрожали, а по обветренным щекам, теряясь в седой щетине, покатились скупые, горячие слезы. Старик закрыл лицо ладонями, глухо всхлипнув. Вэл молча подошла сзади, обвила его шею руками и прижалась щекой к его затылку, крепко сжимая, разделяя с ним эту внезапную, обрушившуюся пустоту.\n\nАвтор: Воздух вырвался из груди со свистом, ноги подкосились, и девушка сползла спиной по шершавой стене, зажимая рот ладонью, чтобы заглушить рвущиеся наружу рыдания. Слезы хлынули градом, обжигая щеки. Пейдж ни секунды не колебалась — опустилась рядом, притянула Хлою к себе и уткнулась подбородком в ее растрепанную макушку,молча покачивая, пока та выплакивала всю свою прошлую жизнь."}],"assets":[{"id":"04fdfb29-282e-474a-8be7-0f3d4e1490ee","projectId":"7dc8cca6-feba-4786-bb94-d3e739522d1a","kind":"sprite","name":"grok-image-8da3841d-8d55-4bd5-88c6-fe77c55264e8","mime":"image/png","createdAt":1794769958598,"character":"Пейдж","file":"media/04fdfb29-282e-474a-8be7-0f3d4e1490ee.png"},{"id":"0503621a-12a3-4093-85da-b127f788a8e6","projectId":"7dc8cca6-feba-4786-bb94-d3e739522d1a","kind":"sprite","name":"grok-image-43b43e8e-40c2-43bb-97ad-fd323fed9099","mime":"image/png","createdAt":1794769958471,"character":"Пейдж","file":"media/0503621a-12a3-4093-85da-b127f788a8e6.png"},{"id":"06e3306a-fd31-45c1-9156-3288fcfe261b","projectId":"7dc8cca6-feba-4786-bb94-d3e739522d1a","kind":"sprite","name":"grok-image-2ad78ff0-1348-4a69-8df6-3d71ecb1aa80","mime":"image/png","createdAt":1794769957313,"character":"Хлоя","file":"media/06e3306a-fd31-45c1-9156-3288fcfe261b.png"},{"id":"0b550dd2-7059-4a36-ac9d-ae957495056e","projectId":"7dc8cca6-feba-4786-bb94-d3e739522d1a","kind":"sprite","name":"grok-image-7530dbf1-56b8-49a0-badf-a6c445d734bc","mime":"image/png","createdAt":1794769957750,"character":"Хлоя","file":"media/0b550dd2-7059-4a36-ac9d-ae957495056e.png"},{"id":"1128ae9e-a83d-499f-8e1b-428dbf230491","projectId":"7dc8cca6-feba-4786-bb94-d3e73 <script>
const story = window.STORY;
const frame = document.getElementById("frame");
const file = {};
for (const asset of story.assets) file[asset.id] = asset.file;
const slots = { "far-left": "14%", left: "30%", center: "50%", right: "70%", "far-right": "86%" };
const episode = story.episodes.slice().sort((a, b) => a.order - b.order)[0];
const scenes = episode ? episode.scenes : [];
let index = 0;
let started = false;
let shown = 0;
let timer = 0;
let audio = null;
let audioId = "";

function box(scene) {
  if (scene.plate === "none" || scene.plate === "cutscene") return null;
  if (scene.plateBox) return scene.plateBox;
  if (scene.plate === "chapter") return { x: 34, y: 36, w: 32, h: 22 };
  if (scene.plate === "epigraph") return { x: 27, y: 30, w: 46, h: 32 };
  if (scene.plate === "dialogue") return { x: 37, y: 58, w: 26, h: 16 };
  return { x: 22, y: 28, w: 56, h: 36 };
}
function track(i) {
  for (let n = i; n >= 0; n--) {
    const scene = scenes[n];
    if (!scene) continue;
    if (scene.bgmMode === "stop") return null;
    if (scene.bgmMode === "play" && scene.bgmId) return scene.bgmId;
  }
  return null;
}
function music(i) {
  const id = track(i);
  if (!id || !file[id]) { if (audio) audio.pause(); audioId = ""; return; }
  if (audioId === id && audio) {
    if (audio.ended) audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  if (audio) audio.pause();
  audio = new Audio(file[id]);
  audio.loop = true;
  audio.addEventListener("ended", () => {
    if (!audio || audioId !== id) return;
    audio.currentTime = 0;
    audio.play().catch(() => {});
  });
  audioId = id;
  audio.play().catch(() => {});
}
let drawn = -2;
let previousHtml = "";
function sceneHtml(scene, reveal, live) {
  const bg = scene.backgroundId && file[scene.backgroundId];
  const plate = scene.plateAssetId && file[scene.plateAssetId];
  const b = box(scene);
  let html = bg ? "<img class='bg' alt='' src='" + bg + "'>" : "";
  if (!scene.videoId) {
    for (const member of scene.cast) {
      const src = file[member.assetId];
      if (!src) continue;
      const free = member.x != null && member.y != null && member.h != null;
      const style = free
        ? "left:" + member.x + "%;top:" + member.y + "%;height:" + member.h + "%"
        : "left:" + (slots[member.slot] || "50%") + ";bottom:0;height:" + (92 * (member.scale || 1)) + "%;transform:translateX(-50%)";
      html += "<div class='actor' style='" + style + "'><img alt='' src='" + src + "'" + (member.flip ? " style='transform:scaleX(-1)'" : "") + "></div>";
    }
  }
  if (scene.videoId && file[scene.videoId]) {
    html += "<video class='bg' src='" + file[scene.videoId] + "' autoplay playsinline></video>";
  } else if (b) {
    const center = scene.plate === "chapter" || scene.plate === "epigraph";
    const ink = scene.textOnDark ? " light" : "";
    const text = escape(scene.text.slice(0, reveal));
    html += "<div class='plate" + (scene.plate === "dialogue" ? " dialogue" : "") + (center ? " center" : "") + "' style='left:" + b.x + "%;top:" + b.y + "%;width:" + b.w + "%;height:" + b.h + "%'>";
    html += plate ? "<img class='skin' alt='' src='" + plate + "'>" : "<div class='paper'></div>";
    html += "<div class='txt" + ink + "'>";
    if (scene.plate === "chapter" && scene.kicker) html += "<div class='who'>" + escape(scene.kicker) + "</div>";
    if (scene.plate === "dialogue" && scene.speaker) html += "<div class='who'>" + escape(scene.speaker) + "</div>";
    html += "<div" + (live ? " id='line'" : "") + " class='" + (scene.plate === "chapter" ? "title" : "") + "'>" + text + "</div>";
    if (scene.plate === "epigraph" && scene.speaker) html += "<div class='who'>" + escape(scene.speaker) + "</div>";
    html += "</div></div>";
  }
  return html;
}
function draw() {
  const scene = scenes[index];
  if (!scene) { frame.innerHTML = "<div id='end'><h1>Пусто</h1></div>"; drawn = -2; return; }
  if (!started) {
    const bg = scene.backgroundId && file[scene.backgroundId] ? file[scene.backgroundId] : "";
    frame.innerHTML = "<div id='start'>" + (bg ? "<img class='bg' alt='' src='" + bg + "' style='opacity:.45'>" : "") +
      "<p>" + escape(story.project.title) + "</p><h1>" + escape(episode.title) + "</h1><p>Клик или пробел</p></div>";
    drawn = -2;
    return;
  }
  const line = document.getElementById("line");
  if (drawn === index && line) {
    line.textContent = scene.text.slice(0, shown);
    return;
  }
  const motion = scene.transition && scene.transition !== "cut" ? scene.transition : "";
  const keepOld = motion && motion !== "flash";
  const under = keepOld && previousHtml ? "<div class='shot" + (motion === "fade" ? " fade-out" : "") + "'>" + previousHtml + "</div>" : "";
  const html = sceneHtml(scene, shown, true);
  previousHtml = sceneHtml(scene, scene.text.length, false);
  const black = motion === "fade" ? "<div class='black'></div>" : "";
  frame.innerHTML = black + under + "<div class='shot " + motion + "'>" + html + "</div><div id='bar'><i style='width:" + (((index + 1) / Math.max(1, scenes.length)) * 100) + "%'></i></div>";
  drawn = index;
  const video = frame.querySelector("video");
  if (video) video.onended = () => go(index + 1);
}
function escape(value) {
  return String(value || "").replace(/[&<>]/g, (ch) => ch === "&" ? "&" + "amp;" : ch === "<" ? "&" + "lt;" : "&" + "gt;");
}
function type() {
  clearInterval(timer);
  const scene = scenes[index];
  const text = scene ? scene.text : "";
  shown = 0;
  if (!text) { shown = 0; draw(); return; }
  timer = setInterval(() => {
    shown += 1;
    if (shown >= text.length) clearInterval(timer);
    draw();
  }, 28);
}
function go(next) {
  if (next >= scenes.length) {
    clearInterval(timer);
    if (audio) { audio.pause(); audio.currentTime = 0; }
    frame.innerHTML = "<div id='end'><h1>Конец серии</h1><button class='link' id='again'>Сначала</button></div>";
    const again = document.getElementById("again");
    if (again) again.onclick = (event) => { event.stopPropagation(); go(0); };
    return;
  }
  index = Math.max(0, next);
  const scene = scenes[index];
  music(index);
  if (scene && scene.sfxId && file[scene.sfxId]) new Audio(file[scene.sfxId]).play().catch(() => {});
  type();
}
function advance() {
  if (!started) { started = true; go(0); return; }
  const text = scenes[index] ? scenes[index].text : "";
  if (shown < text.length) { clearInterval(timer); shown = text.length; draw(); return; }
  go(index + 1);
}
frame.addEventListener("click", advance);
window.addEventListener("keydown", (event) => {
  if (event.key === " " || event.key === "ArrowRight" || event.key === "Enter") { event.preventDefault(); advance(); }
  if (event.key === "ArrowLeft") { event.preventDefault(); go(index - 1); }
});
draw();
</script>
</body>
</html>
